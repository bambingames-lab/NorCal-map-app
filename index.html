<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Territory Manager V2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brandWrap">
      <div class="brand">Territory Manager</div>
      <div class="version">V2 Preview</div>
    </div>
    <nav class="topActions">
      <button id="accountBtn">Account</button>
      <button id="adminBtn">Admin</button>
      <button id="settingsBtn">Settings</button>
    </nav>
  </header>

  <main id="map"></main>

  <button id="gpsFab" class="fab gps" aria-label="Location">
    <span>◎</span>
  </button>
  <button id="drawFab" class="fab draw" aria-label="Draw">
    <span>✎</span>
  </button>

  <section id="sheet" class="sheet hidden">
    <div class="handle"></div>
    <div class="sheetHead">
      <h2 id="sheetTitle">Menu</h2>
      <button id="closeSheetBtn" class="blackBtn">Close</button>
    </div>
    <div id="sheetBody" class="sheetBody"></div>
  </section>

  <div id="loadingBox" class="loadingBox">Loading map…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <script src="bundle.js?v=3"></script>
</body>
</html>
